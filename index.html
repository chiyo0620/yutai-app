<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外食株主優待ノート</title>
  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 外部CSSの読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-top">
        <h1>🍽️ 外食優待ノート</h1>
        <div class="sync-status"><span class="sync-dot"></span> 夫婦共有中</div>
      </div>
    </header>

    <!-- ★第1弾：浮いた外食費カード（タップで履歴表示、切替ボタンで今月/今年） -->
    <section class="savings-card" onclick="handleSavingsCardClick(event)">
      <div class="savings-left">
        <div class="savings-title-wrap">
          <span class="savings-title" id="savings-title">今年浮いた外食費（累計）</span>
          <button class="savings-toggle-btn" id="savings-toggle-btn" onclick="toggleSavingsPeriod(event)">今月に切替</button>
        </div>
        <div class="savings-sub">タップして利用履歴を見る 📖</div>
      </div>
      <div class="savings-amount" id="savings-amount">¥0</div>
    </section>

    <!-- カレンダーエリア -->
    <section class="calendar-card">
      <div class="calendar-header">
        <button class="calendar-nav-btn" id="prev-month">&lt;</button>
        <div class="current-month-label" id="month-label"></div>
        <button class="calendar-nav-btn" id="next-month">&gt;</button>
      </div>
      <div class="calendar-grid" id="calendar-grid">
        <div class="weekday-header">日</div>
        <div class="weekday-header">月</div>
        <div class="weekday-header">火</div>
        <div class="weekday-header">水</div>
        <div class="weekday-header">木</div>
        <div class="weekday-header">金</div>
        <div class="weekday-header">土</div>
      </div>
    </section>

    <!-- 優待リスト -->
    <section>
      <div class="list-header">
        <div class="list-title" id="list-title">有効期限が近い順</div>
        <button class="filter-reset-btn" id="reset-filter" onclick="resetFilter()">すべて表示</button>
      </div>
      <div class="yutai-list" id="yutai-list"></div>
    </section>

    <button class="fab" onclick="openModal()">＋</button>
  </div>

  <!-- 新規登録モーダル -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:1.1rem;">新しい優待を登録</strong>
        <span onclick="closeModal()" style="font-size:1.5rem; cursor:pointer;">&times;</span>
      </div>
      <div class="form-group">
        <label>銘柄名・店名</label>
        <input type="text" id="m-name" class="form-input" placeholder="例: すかいらーく" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>アイコン</label>
          <select id="m-icon" class="form-select">
            <option value="🍕">🍕 ピザ・ファミレス</option>
            <option value="🍣">🍣 寿司</option>
            <option value="🥩">🥩 焼肉・肉</option>
            <option value="☕️">☕️ カフェ・軽食</option>
            <option value="🍚">🍚 定食・丼</option>
            <option value="🍺">🍺 居酒屋</option>
            <option value="🍽️">🍽️ その他</option>
          </select>
        </div>
        <div class="form-group">
          <label>タイプ</label>
          <select id="m-is-point" class="form-select">
            <option value="false">500円等の紙券</option>
            <option value="true">1円単位ポイント</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>残高（合計金額）</label>
          <input type="number" id="m-amount" class="form-input" placeholder="3000" inputmode="numeric" />
        </div>
        <div class="form-group">
          <label>券面額 (紙券のみ)</label>
          <input type="number" id="m-unit" class="form-input" value="500" inputmode="numeric" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>有効期限</label>
          <input type="date" id="m-limit-date" class="form-input" />
        </div>
        <div class="form-group">
          <label>保管場所</label>
          <select id="m-holder" class="form-select">
            <option value="妻の財布">妻の財布</option>
            <option value="夫の財布">夫の財布</option>
            <option value="自宅">自宅</option>
          </select>
        </div>
      </div>
      <button class="submit-btn" onclick="saveNewCoupon()">Supabaseに保存</button>
    </div>
  </div>

  <!-- ★ポイント・金額指定利用モーダル -->
  <div class="modal-overlay" id="use-modal-overlay" onclick="closeUseModalOnBackdrop(event)">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:1.1rem;" id="use-modal-title">優待を使う</strong>
        <span onclick="closeUseModal()" style="font-size:1.5rem; cursor:pointer;">&times;</span>
      </div>
      <div class="form-group" style="margin-top: 8px;">
        <label id="use-modal-label">お会計で使った金額（円）</label>
        <input type="number" id="use-amount-input" class="form-input" placeholder="例: 1420" inputmode="numeric" />
        <small style="color:var(--text-sub); margin-top:4px;" id="use-current-balance">現在の残高: ¥0</small>
      </div>
      <button class="submit-btn" onclick="confirmUseAmount()">利用を記録する</button>
    </div>
  </div>

  <!-- ★使った履歴のタイムライン（外食アルバム）モーダル -->
  <div class="modal-overlay" id="history-modal-overlay" onclick="closeHistoryModalOnBackdrop(event)">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
        <strong style="font-size:1.1rem;">📖 外食・利用履歴</strong>
        <span onclick="closeHistoryModal()" style="font-size:1.5rem; cursor:pointer;">&times;</span>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <!-- 外部JavaScriptの読み込み -->
  <script src="app.js"></script>
</body>
</html>
